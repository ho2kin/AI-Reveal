[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reveal"
version = "0.1.0"
description = "LaTeX/PDF 论文 AI 率检测工具：提取论文正文，调用朱雀模型检测 AI 生成率，用 jev 决策模型复核并给出修改建议"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "PyMuPDF>=1.24",
    "pylatexenc>=2.10",
    "jinja2>=3.1",
]

[project.scripts]
ai-reveal = "ai_reveal.cli:main"

[tool.setuptools.packages.find]
include = ["ai_reveal*"]
